{% extends "layout.html" %}
{% block content %}
<h2>Confirm your new email address</h2>
<p>Confirm that this address should replace the current one on your account.</p>
<p><a href="{{ link }}" style="display: inline-block; padding: 10px 18px; background: #2563eb; color: #fff; text-decoration: none; border-radius: 6px;">Confirm new email</a></p>
<p>Or paste this link into your browser:<br>{{ link }}</p>
<p>This link expires in {{ expires_in }}.</p>
{% endblock %}
