{% extends "layout.html" %}
{% block content %}
<h2>Reset your password</h2>
<p>We received a request to reset your password.</p>
<p><a href="{{ link }}" style="display: inline-block; padding: 10px 18px; background: #2563eb; color: #fff; text-decoration: none; border-radius: 6px;">Choose a new password</a></p>
<p>Or paste this link into your browser:<br>{{ link }}</p>
<p>This link expires in {{ expires_in }}.</p>
{% endblock %}
