[package]
name = "api-starter-axum"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
askama = "0.16.1"
axum = { version = "0.8.9", features = ["macros"] }
axum-prometheus = "0.10.1"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
lettre = { version = "0.11.23", default-features = false, features = ["tokio1", "tokio1-rustls", "aws-lc-rs", "rustls-native-certs", "builder", "smtp-transport", "pool", "hostname"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "migrate", "macros", "derive", "uuid", "chrono"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
totp-rs = { version = "5.7.0", features = ["gen_secret", "qr"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "timeout", "request-id", "compression-gzip", "util", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
utoipa = { version = "5.4.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
zxcvbn = "3.1.0"

[dev-dependencies]
http-body-util = "0.1.5"
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }
